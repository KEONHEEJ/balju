<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6E5C">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="발주판">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  html{color-scheme:light dark}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none !important}
</style>
<title>콴안다오 발주판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
</head>
<body>
<style>
:root{
  --paper:#FAF9F5;
  --card:#FFFFFF;
  --ink:#15191B;
  --ink-2:#5B6268;
  --ink-3:#8D9399;
  --rule:#E3E1D8;
  --rule-2:#CFCCC0;
  --jade:#0F6E5C;
  --jade-bg:#E7F1ED;
  --maroon:#96233A;
  --maroon-bg:#F8E9EC;
  --amber:#9C5309;
  --amber-bg:#F9EDDF;
  --sheet-scrim:rgba(21,25,27,.45);
  --mono:"IBM Plex Mono","SFMono-Regular",ui-monospace,monospace;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --serif:"Gowun Batang","Apple SD Gothic Neo",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101314; --card:#171B1D;
    --ink:#ECEEEC; --ink-2:#A4ABAF; --ink-3:#757C81;
    --rule:#262B2E; --rule-2:#3B4241;
    --jade:#57CBAA; --jade-bg:#12302A;
    --maroon:#E88EA2; --maroon-bg:#33181F;
    --amber:#E2A465; --amber-bg:#33240F;
    --sheet-scrim:rgba(0,0,0,.62);
  }
}
:root[data-theme="dark"]{
  --paper:#101314; --card:#171B1D;
  --ink:#ECEEEC; --ink-2:#A4ABAF; --ink-3:#757C81;
  --rule:#262B2E; --rule-2:#3B4241;
  --jade:#57CBAA; --jade-bg:#12302A;
  --maroon:#E88EA2; --maroon-bg:#33181F;
  --amber:#E2A465; --amber-bg:#33240F;
  --sheet-scrim:rgba(0,0,0,.62);
}

*{box-sizing:border-box}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.45;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 150px}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:30;background:var(--paper);
  border-bottom:1px solid var(--rule);margin:0 -14px;padding:13px 14px 0;
}
.masthead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--serif);font-weight:700;font-size:1.34rem;letter-spacing:-.01em;margin:0;text-wrap:balance}
.stamp{font-family:var(--mono);font-size:.71rem;color:var(--ink-3);letter-spacing:.04em;white-space:nowrap;font-variant-numeric:tabular-nums}
.tally{display:flex;gap:6px;margin:10px 0 0;padding:0 0 10px;overflow-x:auto;scrollbar-width:none}
.tally::-webkit-scrollbar{display:none}
.tally a{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;text-decoration:none;
  color:var(--ink-2);border:1px solid var(--rule);border-radius:999px;
  padding:6px 12px 6px 10px;font-size:.79rem;font-weight:500;background:var(--card);
}
.tally a:focus-visible{outline:2px solid var(--g,var(--jade));outline-offset:2px}
.tally .dot{width:8px;height:8px;border-radius:50%;background:var(--g);flex:0 0 auto}
.tally .n{font-family:var(--mono);font-weight:600;font-size:.78rem;color:var(--g);font-variant-numeric:tabular-nums}

/* ---------- 탭 : 시재 / 발주 ---------- */
.tabs{
  display:flex;gap:4px;margin:11px 0 0;padding:3px;
  background:var(--card);border:1px solid var(--rule);border-radius:12px;
}
.tabs button{
  flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:7px;
  font:inherit;font-size:.9rem;font-weight:600;padding:10px 6px;
  border:0;border-radius:9px;background:transparent;color:var(--ink-3);cursor:pointer;
}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tabs button:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.tabs .tn{
  font-family:var(--mono);font-size:.73rem;font-weight:600;
  padding:1px 7px;border-radius:999px;
  background:var(--rule);color:var(--ink-2);font-variant-numeric:tabular-nums;
}
.tabs button[aria-selected="true"] .tn{background:var(--paper);color:var(--ink)}

/* 모드에 따라 행의 구성이 바뀐다 — 조작 방식은 양쪽이 똑같다 */
.mode-stock .tick,
.mode-stock .grp-order,
.mode-stock .stkview,
.mode-stock .echo,
.mode-stock .mark,
.mode-stock .add{display:none}
.mode-stock .row{grid-template-columns:minmax(0,1fr) auto}
.mode-order .grp-stock{display:none}

/* 단위와 수량은 한 덩어리로 붙어 있다 */
.ctlgrp{display:flex;align-items:center;gap:5px;flex:0 0 auto}

/* 발주 탭에서 적어둔 시재를 곁들여 보여준다 */
.stkview{
  align-self:flex-start;margin-top:3px;
  font-family:var(--mono);font-size:.7rem;font-weight:600;
  color:var(--g);white-space:nowrap;
  border:1px solid var(--g);border-radius:6px;
  padding:2px 7px;background:var(--g-bg);
}
.stkview[hidden]{display:none}

/* 시재가 적힌 행은 조절기에도 표시가 난다 */
.row.rec .grp-stock .step{border-color:var(--g);background:var(--g-bg)}
.row.rec .grp-stock .num{color:var(--ink)}
.row.rec .grp-stock .step button{color:var(--g)}
.row.rec .grp-stock .uni{border-color:var(--g);background:var(--g-bg)}
.row.rec .grp-stock .uni .ut{color:var(--g)}

/* ---------- search ---------- */
.seek{position:relative;margin:12px 0 4px}
.seek input{
  width:100%;font:inherit;font-size:16px;padding:11px 40px 11px 14px;
  border:1px solid var(--rule);border-radius:11px;background:var(--card);color:var(--ink);
}
.seek input::placeholder{color:var(--ink-3)}
.seek input:focus{outline:2px solid var(--jade);outline-offset:-1px;border-color:transparent}
.seek button{
  position:absolute;right:5px;top:50%;transform:translateY(-50%);
  border:0;background:none;color:var(--ink-3);font:inherit;font-size:1.1rem;
  line-height:1;padding:8px 10px;cursor:pointer;border-radius:8px;
}

/* ---------- ledger block ---------- */
section{margin:26px 0 0;scroll-margin-top:116px}
.bar{display:flex;align-items:center;gap:10px;padding:0 0 9px;border-bottom:2px solid var(--g)}
.bar h2{font-family:var(--serif);font-weight:700;font-size:1.05rem;margin:0;color:var(--g);letter-spacing:.01em}
.bar .memo{font-size:.73rem;color:var(--ink-3);margin-left:auto;text-align:right;line-height:1.3}

.sub{font-size:.67rem;font-weight:600;letter-spacing:.14em;color:var(--ink-3);margin:18px 0 0;padding-left:2px}
.sub:first-of-type{margin-top:13px}

ul{list-style:none;margin:5px 0 0;padding:0}
li{border-bottom:1px solid var(--rule)}

.row{
  display:grid;grid-template-columns:26px minmax(0,1fr) auto;
  align-items:center;gap:9px;min-height:60px;padding:9px 0;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.tick{
  appearance:none;-webkit-appearance:none;margin:0;
  width:22px;height:22px;justify-self:center;
  border:1.5px solid var(--rule-2);border-radius:6px;
  background:var(--card);cursor:pointer;position:relative;
}
.tick:checked{background:var(--g);border-color:var(--g)}
.tick:checked::after{
  content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;
  border:solid var(--card);border-width:0 2.5px 2.5px 0;transform:rotate(42deg);
}
.tick:focus-visible{outline:2px solid var(--g);outline-offset:2px}

.meta{min-width:0;display:flex;flex-direction:column;gap:1px}
.nm{font-size:.94rem;font-weight:500;color:var(--ink);overflow-wrap:anywhere}
.row.on .nm{font-weight:700}
.spec{font-family:var(--mono);font-size:.7rem;color:var(--ink-3);overflow-wrap:anywhere;line-height:1.35}
.usual{font-weight:700;color:var(--ink-2)}
.echo{
  font-family:var(--mono);font-size:.72rem;font-weight:600;color:var(--g);
  line-height:1.35;overflow-wrap:anywhere;
}
.echo[hidden]{display:none}

/* ---------- stepper ---------- */
.step{
  display:flex;align-items:stretch;flex:0 0 auto;
  border:1px solid var(--rule-2);border-radius:10px;
  background:var(--card);overflow:hidden;
}
.step button{
  width:34px;border:0;background:transparent;cursor:pointer;
  color:var(--ink-2);font-family:var(--mono);font-size:1.2rem;font-weight:600;
  line-height:1;padding:0;-webkit-tap-highlight-color:transparent;
}
.step button:active{background:var(--g-bg)}
.step button:focus-visible{outline:2px solid var(--g);outline-offset:-2px}
.num{
  width:46px;min-width:0;border:0;
  border-left:1px solid var(--rule);border-right:1px solid var(--rule);
  background:transparent;text-align:center;
  font-family:var(--mono);font-size:16px;font-weight:600;
  font-variant-numeric:tabular-nums;color:var(--ink-3);padding:10px 2px;
}
.num:focus{outline:2px solid var(--g);outline-offset:-2px;color:var(--ink)}
.row.on .step{border-color:var(--g);background:var(--g-bg)}
.row.on .num{color:var(--ink);border-color:color-mix(in srgb, var(--g) 26%, transparent)}
.row.on .step button{color:var(--g)}

/* 단위 고르개 — 수량 바로 옆, 눌러서 바꾼다 */
.uni{
  position:relative;display:inline-flex;align-items:center;justify-content:center;
  flex:0 0 auto;min-width:54px;
  border:1px solid var(--rule-2);border-radius:9px;
  padding:9px 17px 9px 9px;background:var(--card);
}
.uni .ut{font-family:var(--mono);font-size:.79rem;font-weight:600;color:var(--ink-2);white-space:nowrap}
.uni::after{
  content:"▾";position:absolute;right:6px;top:50%;transform:translateY(-50%);
  font-size:.6rem;color:var(--ink-3);pointer-events:none;
}
.uni.single{padding-right:9px;min-width:44px;opacity:.75}
.uni.single::after{content:none}
.uni select{
  position:absolute;inset:0;width:100%;height:100%;
  opacity:0;border:0;appearance:none;-webkit-appearance:none;font-size:16px;cursor:pointer;
}
.uni:focus-within{outline:2px solid var(--g);outline-offset:1px}
.row.on .uni{border-color:var(--g);background:var(--g-bg)}
.row.on .uni .ut{color:var(--g)}

/* ---------- custom rows ---------- */
.add{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0 0}
.add input,.add select{
  font:inherit;font-size:16px;padding:10px 12px;
  border:1px dashed var(--rule-2);border-radius:9px;
  background:transparent;color:var(--ink);min-width:0;
}
.add .f-name{flex:1 1 100%}
.add .f-n{flex:0 0 76px;text-align:center;font-family:var(--mono)}
.add select{flex:0 0 auto;border-style:solid;border-color:var(--rule);background:var(--card);color:var(--ink-2);font-size:.85rem}
.add input::placeholder{color:var(--ink-3)}
.add input:focus,.add select:focus{outline:2px solid var(--g);outline-offset:-1px;border-style:solid;border-color:transparent}
.add button{
  flex:1 1 auto;font:inherit;font-size:.86rem;font-weight:600;
  padding:10px 15px;border:1px solid var(--g);border-radius:9px;
  background:transparent;color:var(--g);cursor:pointer;
}
.kill{
  appearance:none;border:0;background:none;cursor:pointer;color:var(--ink-3);
  font-size:1.1rem;line-height:1;padding:10px 4px;justify-self:center;
}

/* ---------- dock ---------- */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);
  border-top:1px solid var(--rule);padding:11px 14px calc(11px + env(safe-area-inset-bottom));
}
.dock-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:9px}
.ct{font-size:.78rem;color:var(--ink-2);line-height:1.35;min-width:0}
.ct b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.dock-row{display:flex;gap:8px}
.dock button{font:inherit;font-weight:700;border-radius:11px;cursor:pointer;padding:14px 16px}
.dock .solid{flex:1 1 auto;font-size:.97rem;border:0;background:var(--ink);color:var(--paper)}
.dock .solid.done{background:var(--jade)}
.dock .ghost{
  flex:0 0 auto;font-size:.88rem;font-weight:600;
  border:1px solid var(--rule-2);background:transparent;color:var(--ink-2);
}
.dock button:disabled{opacity:.32;cursor:default}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:var(--sheet-scrim);display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{
  width:100%;max-width:640px;max-height:88vh;background:var(--paper);
  border-radius:18px 18px 0 0;border-top:1px solid var(--rule);
  display:flex;flex-direction:column;overflow:hidden;
}
.sheet-top{display:flex;align-items:center;gap:12px;padding:16px 16px 12px;border-bottom:1px solid var(--rule)}
.sheet-top h3{font-family:var(--serif);font-size:1.06rem;margin:0;font-weight:700}
.sheet-top button{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--ink-2);font-size:1.5rem;line-height:1;padding:2px 6px}
.sheet-body{overflow-y:auto;padding:4px 16px 22px;-webkit-overflow-scrolling:touch}
.msg{margin:16px 0 0}
.msg-top{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.msg-top h4{font-size:.8rem;font-weight:700;margin:0;color:var(--g);letter-spacing:.02em}
.msg-top button{
  margin-left:auto;font:inherit;font-size:.82rem;font-weight:600;
  padding:8px 16px;border-radius:999px;cursor:pointer;
  border:1px solid var(--g);background:var(--g);color:var(--card);
}
.msg-top button.done{background:transparent;color:var(--g)}
.msg-top button:disabled{opacity:.35;cursor:default}
pre{
  margin:0;padding:14px;background:var(--card);border:1px solid var(--rule);
  border-radius:11px;font-family:var(--mono);font-size:.82rem;line-height:1.65;
  color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;max-height:34vh;overflow-y:auto;
}
pre.empty{color:var(--ink-3);font-style:italic}
.sep{
  font-size:.71rem;font-weight:600;letter-spacing:.1em;color:var(--ink-3);
  margin:26px 0 -4px;padding-top:18px;border-top:1px solid var(--rule);
}
.reset{
  display:block;width:100%;margin:26px 0 0;font:inherit;font-size:.85rem;font-weight:600;
  padding:12px;border-radius:10px;cursor:pointer;
  border:1px solid var(--rule-2);background:transparent;color:var(--ink-2);
}
.reset:hover{border-color:var(--maroon);color:var(--maroon)}

.wipe{margin:34px 0 0;padding:16px 0 0;border-top:1px solid var(--rule)}
.wipe h3{font-size:.68rem;font-weight:600;letter-spacing:.13em;color:var(--ink-3);margin:0 0 10px}
.wipe .btns{display:flex;gap:7px;flex-wrap:wrap}
.wipe button{
  flex:1 1 30%;min-width:96px;font:inherit;font-size:.82rem;font-weight:600;
  padding:11px 8px;border-radius:9px;cursor:pointer;
  border:1px solid var(--rule-2);background:transparent;color:var(--ink-2);
}
.wipe button:hover{border-color:var(--maroon);color:var(--maroon)}
.wipe button.arm{border-color:var(--maroon);background:var(--maroon-bg);color:var(--maroon)}
.wipe button:disabled{opacity:.32;cursor:default}

.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--paper);font-size:.85rem;font-weight:600;
  padding:11px 18px;border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.18);
  opacity:0;pointer-events:none;transition:opacity .18s ease;max-width:86vw;text-align:center;
}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;scroll-behavior:auto !important}}
</style>

<div class="wrap">
  <header>
    <div class="masthead">
      <h1>콴안다오 발주판</h1>
      <div class="stamp" id="stamp"></div>
    </div>
    <div class="tabs" role="tablist" aria-label="화면 전환">
      <button type="button" role="tab" id="tab-stock" aria-selected="false" aria-controls="sheets">
        시재 적기 <span class="tn" id="tn-stock">0</span>
      </button>
      <button type="button" role="tab" id="tab-order" aria-selected="true" aria-controls="sheets">
        발주 담기 <span class="tn" id="tn-order">0</span>
      </button>
    </div>
    <nav class="tally" id="tally"></nav>
  </header>

  <div class="seek">
    <input id="seek" type="search" placeholder="품목 찾기 — 숙주, 미원, 사골…" autocomplete="off">
    <button type="button" id="seek-x" aria-label="검색 지우기" hidden>×</button>
  </div>

  <main id="sheets" class="mode-order"></main>
</div>

<div class="dock">
  <div class="dock-in">
    <div class="ct" id="count">＋ 를 눌러 담으세요</div>
    <div class="dock-row">
      <button type="button" class="ghost" id="make" disabled>보고서</button>
      <button type="button" class="solid" id="copyall" disabled>전체 복사</button>
    </div>
  </div>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h">
    <div class="sheet-top">
      <h3 id="sheet-h">복사하기</h3>
      <button type="button" id="close" aria-label="닫기">×</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ==================================================================
   품목 대장
   출처 — 거래명세표 2026-08-03 ~ 09-07 규격 + 발주서.xlsx 기준량
   단위 표기  라벨[:증감폭][^앞에붙는규격]   맨 앞이 기본 단위
================================================================== */
const ITEMS = {
  meat: [[null, [
    ["사골",            "kg · 기준 20kg",            "kg|봉",            10],
    ["양지",            "차돌양지 · 1박스 20kg",      "박스",              1],
    ["목전지",          "돈목심 · 기준 2kg",          "kg",                5],
    ["민찌",            "돈민찌 · 기준 2kg",          "kg|g:500",          3, "(500g 씩 소분)"],
    ["삼겹살",          "kg · 기준 2kg",             "kg|덩이",            2],
    ["닭다리",          "kg",                        "kg|팩",              2],
  ]]],

  main: [
    ["야채", [
      ["숙주",           "3.5kg / 박스",              "박스|kg",            5],
      ["새송이버섯",      "2kg / 박스",                "kg|박스|봉",         2],
      ["양파",           "햇양파 · 망 15kg · 2번 특",   "망|kg",              1],
      ["실파",           "쪽파 · 500g 내외 / 단",      "단|kg",              3],
      ["부추",           "단 · 상 국내산",             "단|kg",              3],
      ["고수",           "400g · 특 국내산",           "g:100|kg",         400],
      ["상추",           "청상추 잎중 · kg",           "g:100|kg",         300],
      ["양상추",         "통 / 낱개",                  "통|박스",            1],
      ["얼갈이 배추",     "4kg / 박스",                "kg|박스",             2],
      ["오이",           "백다다기 · kg",              "kg|개",               1],
      ["당근",           "kg · 세척 2L",              "kg|박스",             3],
      ["무",             "흑무 알대 · 개",             "개|kg",               2],

/* 단위는 모든 품목이 똑같은 목록에서 고른다.
   품목마다 다른 것은 "기본으로 뜨는 단위"와 "한 번에 움직이는 폭"뿐이다. */
const ALL_UNITS = "개|박스|kg|g:100|통|팩|봉지|봉|단|판|캔|망|덩이|자루|포|L|ml:100|%:10";

function units(spec){
  return spec.split("|").map(s=>{
    const m = /^([^:^]+)(?::([\d.]+))?(?:\^(.+))?$/.exec(s.trim());
    return { u:m[1], step: m[2]?parseFloat(m[2]):1, pre: m[3]||"" };
  });
}

/* 대장 정규화 — 안정적인 id 부여 */
const ALL = units(ALL_UNITS);
const ALL_STEP = {};
ALL.forEach(u=> ALL_STEP[u.u] = u.step);
const idxOf = label => Math.max(0, ALL.findIndex(u=> u.u === label));

/* 예전 표기(  "개^3kg*|박스"  )에서 기본 단위·접두 규격·증감폭 예외만 뽑아낸다 */
function shape(us){
  const old = units(us);
  const ovr = {};
  old.forEach(u=>{ if(ALL_STEP[u.u] && u.step !== ALL_STEP[u.u]) ovr[u.u] = u.step; });
  return { defU: old[0].u, pre: old[0].pre || "", ovr };
}

GROUPS.forEach(g=>{
  let n = 0;
  g.subs = ITEMS[g.id].map(([title, rows])=>({
    title,
    items: rows.map(([name, spec, us, def, note])=>{
      const sh = shape(us);
      const di = idxOf(sh.defU);
      return {
        id: g.id+"-"+(n++), name, spec, def, note: note||"",
        defU: sh.defU, pre: sh.pre, defIdx: di,
        // 발주 단위 — 접두 규격은 기본 단위일 때만 붙는다
        units: ALL.map(u=>({ u:u.u, step: sh.ovr[u.u] || u.step, pre: (u.u === sh.defU ? sh.pre : "") })),
        // 시재 단위 — 접두 규격 없이
        sunits: ALL.map(u=>({ u:u.u, step: sh.ovr[u.u] || u.step, pre:"" })),
      };
    }),
  }));
});

const LS = "quananhdao.order.v3";
let state = { picked:{}, extra:{meat:[],main:[],etc:[]}, stock:{}, at:0 };
let dbRef = null, saveTimer = null;

function normalize(o){
  if(!o || typeof o!=="object") return null;
  const picked = {};
  const src = o.picked && typeof o.picked==="object" ? o.picked : {};
  Object.keys(src).forEach(k=>{
    if(!BY_ID[k]) return;
    const v = src[k];
    if(!Array.isArray(v)) return;
    const n = Number(v[0]), ui = Number(v[1])|0;
    if(!(n > 0)) return;
    picked[k] = [n, Math.min(Math.max(ui,0), BY_ID[k].units.length-1)];
  });
  const arr = k => Array.isArray(o.extra && o.extra[k])
    ? o.extra[k].filter(r=> r && r.name).map(r=>({
        name:String(r.name), n:Number(r.n)||1, u:String(r.u||"개"),
        stock: Array.isArray(r.stock) ? [Number(r.stock[0])||0, Number(r.stock[1])|0] : null
      }))
    : [];
  const stock = {};
  const ssrc = o.stock && typeof o.stock==="object" ? o.stock : {};
  Object.keys(ssrc).forEach(k=>{
    const it = BY_ID[k];
    if(!it) return;
    const v = ssrc[k];
    if(Array.isArray(v)){
      const n = Number(v[0]), ui = Number(v[1])|0;
      if(n >= 0) stock[k] = [n, Math.min(Math.max(ui,0), it.sunits.length-1)];
      return;
    }
    // 예전에 글자로 적어둔 시재를 옮겨온다
    const t = String(v || "").trim();
    if(!t) return;
    const num = parseFloat(t.replace(/[^\d.]/g, ""));
    if(!(num >= 0)) return;
    const pct = t.indexOf("%") >= 0;
    let ui = pct ? it.sunits.length - 1 : 0;
    if(!pct){
      const tail = t.replace(/[\d.\s]/g, "");
      const hit = it.sunits.findIndex(u=> u.u === tail);
      if(hit >= 0) ui = hit;
    }
    stock[k] = [num, ui];
  });
  return { picked, extra:{ meat:arr("meat"), main:arr("main"), etc:arr("etc") }, stock, at:Number(o.at)||0 };
}
function readLocal(){
  try{ const r = localStorage.getItem(LS); if(r) return normalize(JSON.parse(r)); }catch(e){}
  return null;
}
function save(){
  state.at = Date.now();
  try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){}
  if(dbRef){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{ dbRef.set(JSON.parse(JSON.stringify(state))).catch(()=>{}); }, 600);
  }
}

const fmt = n => String(Math.round(n*1000)/1000);

/* 명세서 기준 통상 발주량 — 발주할 때 참고한다 */
const usualOf = it => it.pre + fmt(it.def) + it.defU;

/* 시재 표기 — 단위가 % 면 "20%", 아니면 "1.2봉" */
const stockOf = (sunits, v)=> v ? fmt(v[0]) + sunits[v[1]].u : "";

/* 카톡에 나가는 값 */
const fullOf = (it, n, ui) => {
  const u = it.units[ui];
  return u.pre + fmt(n) + u.u + (it.note ? " " + it.note : "");
};

/* ---- 수량 조절기 : [−][숫자][+] + 규격줄의 단위 칩 ---- */
function control(opts){
  // opts: units, label, fallback() -> [n,ui], get() -> [n,ui]|null, set(n,ui)
  const step = document.createElement("div");
  step.className = "step";

  const mi = document.createElement("button");
  mi.type = "button"; mi.textContent = "−";
  mi.setAttribute("aria-label", opts.label+" 줄이기");

  const num = document.createElement("input");
  num.type = "text"; num.className = "num";
  num.inputMode = "decimal"; num.autocomplete = "off";
  num.setAttribute("aria-label", opts.label+" 수량 (직접 입력 가능)");

  const pl = document.createElement("button");
  pl.type = "button"; pl.textContent = "+";
  pl.setAttribute("aria-label", opts.label+" 늘리기");

  step.append(mi, num, pl);

  const uni = document.createElement("span");
  uni.className = "uni" + (opts.units.length > 1 ? "" : " single");
  const ut = document.createElement("span");
  ut.className = "ut";
  uni.appendChild(ut);

  let sel = null;
  if(opts.units.length > 1){
    sel = document.createElement("select");
    sel.setAttribute("aria-label", opts.label+" 단위");
    opts.units.forEach((u, i)=>{
      const o = document.createElement("option");
      o.value = String(i); o.textContent = u.u;
      sel.appendChild(o);
    });
    uni.appendChild(sel);
  }

  const paint = ()=>{
    const [n, ui] = opts.get() || opts.fallback();
    if(document.activeElement !== num) num.value = fmt(n);
    ut.textContent = opts.units[ui].u;
    if(sel) sel.value = String(ui);
  };

  /* 1000g 이상은 kg 으로 */
  function tidy(n, ui){
    if(opts.units[ui].u === "g" && n >= 1000){
      const k = opts.units.findIndex(x=> x.u === "kg");
      if(k >= 0) return [Math.round(n / 1000 * 1000) / 1000, k];
    }
    return [n, ui];
  }
  const commit = (n, ui)=>{ const t = tidy(n, ui); opts.set(t[0], t[1]); };
  const curUi = ()=> (opts.get() || opts.fallback())[1];

  const bump = dir => e=>{
    e.preventDefault(); e.stopPropagation();
    const has = opts.get();
    if(!has && dir < 0) return;               // 아직 없는 것에 − 는 무시
    const cur = has || opts.fallback();
    const ui = cur[1];
    let n = cur[0];
    if(has) n = Math.round((n + dir * opts.units[ui].step) * 1000) / 1000;
    if(n < 0) n = 0;
    // 시재는 0 도 기록이다. 0 에서 한 번 더 − 하면 그때 지운다
    if(opts.keepZero && has && n === 0 && cur[0] === 0){ opts.set(-1, ui); paint(); return; }
    commit(n, ui);
    paint();
  };
  mi.addEventListener("click", bump(-1));
  pl.addEventListener("click", bump(1));

  /* 직접 입력 */
  num.addEventListener("click", e=> e.stopPropagation());
  num.addEventListener("focus", ()=> setTimeout(()=>{ try{ num.select(); }catch(e){} }, 0));
  const floor = opts.keepZero ? 0 : 1e-9;
  num.addEventListener("input", ()=>{
    const clean = num.value.replace(/[^\d.]/g, "").replace(/(\..*)\./g, "$1");
    if(clean !== num.value) num.value = clean;
    const n = parseFloat(clean);
    if(n >= floor) opts.set(Math.round(n * 1000) / 1000, curUi());
  });
  num.addEventListener("blur", ()=>{
    const n = parseFloat(num.value);
    if(n >= floor) commit(n, curUi());
    else opts.set(opts.keepZero ? -1 : 0, curUi());   // 비우면 기록을 지운다
    paint();
  });
  num.addEventListener("keydown", e=>{ if(e.key === "Enter"){ e.preventDefault(); num.blur(); } });

  /* 단위 바꾸기 — kg ↔ g 는 숫자도 환산 */
  if(sel){
    sel.addEventListener("click", e=> e.stopPropagation());
    sel.addEventListener("change", e=>{
      e.stopPropagation();
      const cur = opts.get() || opts.fallback();
      const from = opts.units[cur[1]], to = opts.units[+sel.value];
      let n = cur[0];
      if(from.u === to.u){ /* 그대로 */ }
      else if(to.u === "%") n = 50;                       // 비율로 바꾸면 절반에서 시작
      else if(from.u === "%") n = 1;                      // 비율에서 실물 단위로
      else if(from.u === "kg" && to.u === "g") n = n * 1000;
      else if(from.u === "g" && to.u === "kg") n = n / 1000;
      else if(n < to.step) n = to.step;
      opts.set(Math.round(n * 1000) / 1000, +sel.value);   // 고른 단위는 그대로 존중
      paint();
    });
  }

  paint();
  return { step, uni, paint };
}

function rowOf(it){
  const li = document.createElement("li");
  const lab = document.createElement("label");
  lab.className = "row";
  lab.dataset.name = it.name + " " + it.spec;

  const tick = document.createElement("input");
  tick.type = "checkbox"; tick.className = "tick"; tick.id = "t-"+it.id;

  /* 발주 — 얼마나 시킬지 */
  const co = control({
    units: it.units,
    label: it.name,
    fallback: ()=> [it.def, it.defIdx],
    get: ()=> state.picked[it.id] || null,
    set: (n, ui)=>{
      if(n > 0) state.picked[it.id] = [n, ui];
      else delete state.picked[it.id];
      sync(); save(); retally();
    },
  });


  /* 시재 — 지금 얼마나 남았는지. 0 도 기록이다 */
  const cs = control({
    units: it.sunits,
    label: it.name + " 시재",
    keepZero: true,
    fallback: ()=> [1, it.defIdx],
    get: ()=> state.stock[it.id] || null,
    set: (n, ui)=>{
      if(n < 0) delete state.stock[it.id];
      else state.stock[it.id] = [n, ui];
      sync(); save(); retally();
    },
  });


  const meta = document.createElement("span");
  meta.className = "meta";
  const nm = document.createElement("span");
  nm.className = "nm"; nm.textContent = it.name;
  const spec = document.createElement("span");
  spec.className = "spec";
  spec.textContent = it.spec + " · ";
  const usual = document.createElement("b");
  usual.className = "usual";
  usual.textContent = "보통 " + usualOf(it);
  spec.appendChild(usual);
  const view = document.createElement("span");
  view.className = "stkview"; view.hidden = true;
  const echo = document.createElement("span");
  echo.className = "echo"; echo.hidden = true;
  meta.append(nm, spec, view, echo);

  const grpO = document.createElement("span");
  grpO.className = "ctlgrp grp-order";
  grpO.append(co.uni, co.step);
  const grpS = document.createElement("span");
  grpS.className = "ctlgrp grp-stock";
  grpS.append(cs.uni, cs.step);

  function sync(){
    const p = state.picked[it.id];
    tick.checked = !!p;
    lab.classList.toggle("on", !!p);

    const sv = state.stock[it.id];
    lab.classList.toggle("rec", !!sv);
    if(sv){ view.hidden = false; view.textContent = "시재 " + stockOf(it.sunits, sv); }
    else view.hidden = true;

    if(p && (it.note || it.units[p[1]].pre)){
      echo.hidden = false;
      echo.textContent = "→ " + fullOf(it, p[0], p[1]);
    }else echo.hidden = true;
  }

  tick.addEventListener("change", ()=>{
    if(tick.checked) state.picked[it.id] = [it.def, it.defIdx];
    else delete state.picked[it.id];
    sync(); co.paint(); save(); retally();
  });

  lab.append(tick, meta, grpS, grpO);
  li.appendChild(lab);
  li.sync = ()=>{ sync(); co.paint(); cs.paint(); };
  li.sync();
  return li;
}

/* ---- 직접 추가 ---- */
function addForm(gid){
  const box = document.createElement("div");
  box.className = "add";
  const gu = ALL;
  box.innerHTML =
    '<input class="f-name" type="text" id="an-'+gid+'" placeholder="직접 추가 — 품목명" autocomplete="off">'+
    '<input class="f-n" type="number" id="aq-'+gid+'" value="1" min="0" step="any" inputmode="decimal" aria-label="수량">'+
    '<select id="au-'+gid+'" aria-label="단위">'+gu.map(u=>'<option>'+u.u+'</option>').join("")+'</select>'+
    '<button type="button" id="ab-'+gid+'">추가</button>';

  const go = ()=>{
    const n = box.querySelector("#an-"+gid), q = box.querySelector("#aq-"+gid), u = box.querySelector("#au-"+gid);
    const name = n.value.trim();
    if(!name){ n.focus(); return; }
    state.extra[gid].push({ name, n: Math.max(Number(q.value)||1, 0.001), u: u.value, stock: null });
    n.value = ""; q.value = "1"; n.focus();
    save(); drawExtra(gid); retally();
  };
  box.querySelector("#ab-"+gid).addEventListener("click", go);
  box.querySelectorAll("input").forEach(i=>
    i.addEventListener("keydown", e=>{ if(e.key === "Enter"){ e.preventDefault(); go(); } }));
  return box;
}

function drawExtra(gid){
  const ul = document.getElementById("extra-"+gid);
  ul.innerHTML = "";
  const gu = ALL, su = ALL;
  state.extra[gid].forEach((row, i)=>{
    const li = document.createElement("li");
    const d = document.createElement("div");
    d.className = "row on";

    const mark = document.createElement("span");
    mark.className = "mark";
    mark.style.cssText = "justify-self:center;font-family:var(--mono);color:var(--g);font-size:1rem;font-weight:600";
    mark.textContent = "＋";

    const co = control({
      units: gu, label: row.name,
      fallback: ()=> [row.n, Math.max(0, gu.findIndex(u=> u.u === row.u))],
      get: ()=>{
        const r = state.extra[gid][i];
        return r ? [r.n, Math.max(0, gu.findIndex(u=> u.u === r.u))] : null;
      },
      set: (n, k)=>{
        const r = state.extra[gid][i];
        if(!r) return;
        if(n > 0){ r.n = n; r.u = gu[k].u; save(); retally(); }
        else { state.extra[gid].splice(i, 1); save(); drawExtra(gid); retally(); }
      },
    });


    const cs = control({
      units: su, label: row.name + " 시재", keepZero: true,
      fallback: ()=> [1, 0],
      get: ()=>{ const r = state.extra[gid][i]; return (r && r.stock) ? r.stock : null; },
      set: (n, k)=>{
        const r = state.extra[gid][i];
        if(!r) return;
        r.stock = (n < 0) ? null : [n, k];
        paintView(); save(); retally();
      },
    });


    const meta = document.createElement("span");
    meta.className = "meta";
    const nm = document.createElement("span");
    nm.className = "nm"; nm.textContent = row.name;
    const sp = document.createElement("span");
    sp.className = "spec"; sp.textContent = "직접 추가";
    const su2 = document.createElement("b");
    su2.className = "usual";
    su2.textContent = "";
    sp.appendChild(su2);
    const view = document.createElement("span");
    view.className = "stkview"; view.hidden = true;
    meta.append(nm, sp, view);

    const grpO = document.createElement("span");
    grpO.className = "ctlgrp grp-order";
    grpO.append(co.uni, co.step);
    const grpS = document.createElement("span");
    grpS.className = "ctlgrp grp-stock";
    grpS.append(cs.uni, cs.step);

    function paintView(){
      const r = state.extra[gid][i];
      const sv = r && r.stock;
      d.classList.toggle("rec", !!sv);
      if(sv){ view.hidden = false; view.textContent = "시재 " + stockOf(su, sv); }
      else view.hidden = true;
    }
    paintView();

    const x = document.createElement("button");
    x.type = "button"; x.className = "kill"; x.textContent = "×";
    x.setAttribute("aria-label", row.name+" 삭제");
    x.addEventListener("click", ()=>{ state.extra[gid].splice(i, 1); save(); drawExtra(gid); retally(); });

    d.append(mark, meta, grpS, grpO);
    const wrap = document.createElement("div");
    wrap.style.cssText = "display:grid;grid-template-columns:1fr 30px;align-items:center";
    wrap.append(d, x);
    li.appendChild(wrap);
    ul.appendChild(li);
  });
}

function hydrate(){
  document.querySelectorAll("#sheets li").forEach(li=>{ if(li.sync) li.sync(); });
  GROUPS.forEach(g=> drawExtra(g.id));
  retally();
}

/* ==================================================================
   문구
================================================================== */
function lines(g){
  const out = [];
  g.subs.forEach(s=> s.items.forEach(it=>{
    const p = state.picked[it.id];
    if(p) out.push(it.name + " " + fullOf(it, p[0], p[1]));
  }));
  state.extra[g.id].forEach(r=> out.push(r.name + " " + fmt(r.n) + r.u));
  return out;
}
function textOf(g){
  const l = lines(g);
  return l.length ? "발주 내역\n\n"+g.out+"\n"+l.join("\n") : "";
}
/* 오늘 날짜 도장 */
function stamp(){
  const d = new Date(), wd = ["일","월","화","수","목","금","토"][d.getDay()];
  return d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."
       + String(d.getDate()).padStart(2,"0")+" ("+wd+")";
}

/* 시재 + 발주량을 함께 적은 보고서 */
function reportText(){
  const blocks = [], idle = [];
  GROUPS.forEach(g=>{
    const rows = [];
    g.subs.forEach(s=> s.items.forEach(it=>{
      const p = state.picked[it.id];
      const st = stockOf(it.sunits, state.stock[it.id]);
      if(!p && !st) return;
      if(p) rows.push(it.name+" — 현재 "+(st || "미확인")+" / 추가 "+fullOf(it, p[0], p[1]));
      else  idle.push(it.name+" — 현재 "+st);
    }));
    const su = ALL;
    state.extra[g.id].forEach(r=>{
      const st = stockOf(su, r.stock);
      rows.push(r.name+" — 현재 "+(st || "미확인")+" / 추가 "+fmt(r.n)+r.u);
    });
    if(rows.length) blocks.push(g.out+"\n"+rows.join("\n"));
  });
  if(!blocks.length && !idle.length) return "";

  let out = "발주 보고 · "+stamp();
  if(blocks.length) out += "\n\n"+blocks.join("\n\n");
  if(idle.length)   out += "\n\n※ 시재만 확인 (이번엔 발주 안 함)\n"+idle.join("\n");

  let n = 0;
  GROUPS.forEach(g=> n += lines(g).length);
  out += "\n\n발주 "+n+"품목 · 시재 기록 "+stockCount()+"품목";
  return out;
}

function textAll(){
  const b = GROUPS.map(g=>{ const l = lines(g); return l.length ? g.out+"\n"+l.join("\n") : ""; }).filter(Boolean);
  return b.length ? "발주 내역\n\n"+b.join("\n\n") : "";
}

function groupStockCount(g){
  let n = 0;
  g.subs.forEach(s=> s.items.forEach(it=>{ if(state.stock[it.id]) n++; }));
  return n + state.extra[g.id].filter(r=> r.stock).length;
}
function stockCount(){
  return Object.keys(state.stock).length
       + GROUPS.reduce((a,g)=> a + state.extra[g.id].filter(r=> r.stock).length, 0);
}

/* ---------- 탭 ---------- */
const MODE_KEY = "quananhdao.mode";
let mode = "order";
function setMode(m, remember){
  mode = (m === "stock") ? "stock" : "order";
  const main = document.getElementById("sheets");
  main.classList.toggle("mode-stock", mode === "stock");
  main.classList.toggle("mode-order", mode === "order");
  document.getElementById("tab-stock").setAttribute("aria-selected", mode === "stock");
  document.getElementById("tab-order").setAttribute("aria-selected", mode === "order");
  if(remember !== false){ try{ localStorage.setItem(MODE_KEY, mode); }catch(e){} }
  retally();
}

function retally(){
  let total = 0; const bits = [];
  GROUPS.forEach(g=>{
    const n = lines(g).length;
    total += n;
    document.getElementById("n-"+g.id).textContent =
      (mode === "stock") ? groupStockCount(g) : n;
    if(n) bits.push(g.head+" <b>"+n+"</b>");
  });
  const sc = stockCount();
  document.getElementById("tn-stock").textContent = sc;
  document.getElementById("tn-order").textContent = total;

  const el = document.getElementById("count");
  if(mode === "stock"){
    el.innerHTML = sc
      ? "시재 <b>"+sc+"</b>품목 적음"
      : "남아있는 양을 적어두세요";
  }else if(total || sc){
    if(sc) bits.push('<span style="color:var(--ink-3)">시재 <b>'+sc+'</b></span>');
    el.innerHTML = bits.join(" · ");
  }else el.innerHTML = "＋ 를 눌러 담으세요";

  const go = document.getElementById("copyall");
  if(mode === "stock"){
    go.textContent = "발주 담기 →";
    go.dataset.label = "발주 담기 →";
    go.disabled = false;
  }else{
    go.textContent = "전체 복사";
    go.dataset.label = "전체 복사";
    go.disabled = total === 0;
  }
  document.getElementById("make").disabled = (total === 0 && sc === 0);
}

/* ---------- 초기화 : 시재 / 발주 / 전부 ---------- */
function wipeBlock(){
  const box = document.createElement("div");
  box.className = "wipe";
  const h = document.createElement("h3");
  h.textContent = "초기화";
  const btns = document.createElement("div");
  btns.className = "btns";
  box.append(h, btns);

  const jobs = [
    ["시재만 지우기", "시재를 지웠습니다", ()=>{
      state.stock = {};
      GROUPS.forEach(g=> state.extra[g.id].forEach(r=> r.stock = null));
    }],
    ["발주만 지우기", "발주를 지웠습니다", ()=>{
      state.picked = {};
      GROUPS.forEach(g=> state.extra[g.id] = []);
    }],
    ["전부 지우기", "전부 지웠습니다", ()=>{
      state.picked = {}; state.stock = {};
      state.extra = { meat:[], main:[], etc:[] };
    }],
  ];

  jobs.forEach(([label, done, act])=>{
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label;
    let armed = false, timer = null;
    const disarm = ()=>{
      armed = false; clearTimeout(timer);
      b.classList.remove("arm"); b.textContent = label;
    };
    b.addEventListener("click", ()=>{
      if(!armed){
        armed = true;
        b.classList.add("arm");
        b.textContent = "한 번 더 누르면 지워집니다";
        clearTimeout(timer);
        timer = setTimeout(disarm, 4000);
        return;
      }
      disarm();
      act(); save(); hydrate();
      document.querySelectorAll(".wipe").forEach(w=>{
        if(w !== box) w.querySelectorAll("button").forEach(x=> x.dispatchEvent(new Event("__reset")));
      });
      if(!scrim.hidden) closeSheet();
      toast(done);
    });
    b.addEventListener("__reset", disarm);
    btns.appendChild(b);
  });
  return box;
}

const scrim = document.getElementById("scrim");
const sbody = document.getElementById("sheet-body");

function block(title, accent, text){
  const d = document.createElement("div");
  d.className = "msg";
  d.style.setProperty("--g", accent);
  d.innerHTML = '<div class="msg-top"><h4></h4><button type="button"'+(text?"":" disabled")+'>복사</button></div>'+
                '<pre'+(text?"":' class="empty"')+'></pre>';
  d.querySelector("h4").textContent = title;
  d.querySelector("pre").textContent = text || "담은 품목 없음";
  if(text) d.querySelector("button").addEventListener("click", e=> copy(text, e.currentTarget));
  return d;
}
function openSheet(){
  sbody.innerHTML = "";
  sbody.appendChild(block("전체 발주 문구", "var(--ink)", textAll()));
  sbody.appendChild(block("발주 보고 (시재 포함)", "var(--jade)", reportText()));
  const sep = document.createElement("p");
  sep.className = "sep";
  sep.textContent = "발주처가 달라 따로 보낼 때";
  sbody.appendChild(sep);
  GROUPS.forEach(g=> sbody.appendChild(block(g.head, g.c, textOf(g))));

  sbody.appendChild(wipeBlock());

  scrim.hidden = false;
  document.body.style.overflow = "hidden";
}
function closeSheet(){ scrim.hidden = true; document.body.style.overflow = ""; }

document.getElementById("make").addEventListener("click", openSheet);
document.getElementById("copyall").addEventListener("click", e=>{
  if(mode === "stock"){
    setMode("order");
    window.scrollTo({ top:0, behavior:"smooth" });
    return;
  }
  const t = textAll();
  if(t) copy(t, e.currentTarget);
});
document.getElementById("tab-stock").addEventListener("click", ()=> setMode("stock"));
document.getElementById("tab-order").addEventListener("click", ()=> setMode("order"));
document.getElementById("close").addEventListener("click", closeSheet);
scrim.addEventListener("click", e=>{ if(e.target === scrim) closeSheet(); });
document.addEventListener("keydown", e=>{ if(e.key === "Escape" && !scrim.hidden) closeSheet(); });

function copy(text, btn){
  const label = btn.dataset.label || (btn.dataset.label = btn.textContent);
  const ok = ()=>{
    btn.textContent = "복사됨"; btn.classList.add("done");
    toast("복사했습니다 · 카톡에 붙여넣기");
    setTimeout(()=>{ btn.textContent = label; btn.classList.remove("done"); }, 2200);
  };
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(ok).catch(()=> legacy(text, ok));
  else legacy(text, ok);
}
function legacy(text, ok){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  let done = false;
  try{ done = document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  done ? ok() : toast("아래 글을 길게 눌러 복사해 주세요");
}

const elToast = document.getElementById("toast");
let toastTimer;
function toast(msg){
  elToast.textContent = msg; elToast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> elToast.classList.remove("show"), 2100);
}

/* ---- 검색 ---- */
const seek = document.getElementById("seek"), seekX = document.getElementById("seek-x");
seek.addEventListener("input", ()=>{
  const q = seek.value.trim().toLowerCase();
  seekX.hidden = !q;
  document.querySelectorAll("#sheets li").forEach(li=>{
    const r = li.querySelector(".row");
    const hay = r ? (r.dataset.name || r.textContent) : "";
    li.style.display = (!q || hay.toLowerCase().includes(q)) ? "" : "none";
  });
  document.querySelectorAll("#sheets section").forEach(sec=>{
    const any = [...sec.querySelectorAll("li")].some(li=> li.style.display !== "none");
    sec.style.display = (!q || any) ? "" : "none";
    sec.querySelectorAll(".sub").forEach(h=>{
      const ul = h.nextElementSibling;
      const on = ul && [...ul.querySelectorAll("li")].some(li=> li.style.display !== "none");
      h.style.display = (!q || on) ? "" : "none";
      if(ul) ul.style.display = (!q || on) ? "" : "none";
    });
    sec.querySelectorAll(".add").forEach(a=> a.style.display = q ? "none" : "");
  });
});
seekX.addEventListener("click", ()=>{ seek.value = ""; seek.dispatchEvent(new Event("input")); seek.focus(); });

/* ---- 날짜 · 시작 ---- */
(function(){
  const d = new Date(), wd = ["일","월","화","수","목","금","토"][d.getDay()];
  document.getElementById("stamp").textContent =
    d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0")+" ("+wd+")";
})();

const local = readLocal();
if(local) state = local;
build();
let firstMode = "stock";
try{ firstMode = localStorage.getItem(MODE_KEY) || "stock"; }catch(e){}
setMode(firstMode, false);

/* 서버 저장 — 되면 쓰고, 안 되면 이 기기에만 */
(function(){
  const p = (window.claude && window.claude.use) ? window.claude.use("db").catch(()=>null) : Promise.resolve(null);
  p.then(db=>{
    if(!db) return;
    dbRef = db.doc("order/current");
    return dbRef.get().then(snap=>{
      if(!snap.exists){ if(Object.keys(state.picked).length) save(); return; }
      const remote = normalize(snap.data());
      if(remote && remote.at > (state.at||0)){ state = remote; hydrate(); }
    });
  }).catch(()=>{});
})();
